[project]
name = "jobpilot"
version = "0.1.0"
description = "Local CLI tool that finds, scores, and prepares job applications"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "httpx>=0.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "selectolax>=0.3",
    "google-genai>=0.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "fpdf2>=2.8.9",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "respx>=0.20",
    "ruff>=0.4",
]
